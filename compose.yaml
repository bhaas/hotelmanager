# Local production-like stack: PostgreSQL + web app (http://localhost:8080).
# The first start prints the generated admin password in the web container log.
services:
  postgres:
    image: postgres:17
    container_name: hotelmanager-postgres
    environment:
      POSTGRES_DB: hotelmanager
      POSTGRES_USER: hotelapp
      POSTGRES_PASSWORD: hotelapp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelapp -d hotelmanager"]
      interval: 5s
      timeout: 5s
      retries: 8
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotelmanager-web
    environment:
      DATABASE_URL: postgres://hotelapp:hotelapp@postgres:5432/hotelmanager
      Bootstrap__HotelName: Demo Hotel
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
